name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: 冒烟测试 (node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 语法检查 client bundle
        run: node --check lib/client.js

      - name: 运行冒烟测试
        run: node tests/smoke.mjs

      - name: 生成三态预览页
        run: node tools/preview.mjs

      - name: 上传预览页产物
        uses: actions/upload-artifact@v4
        with:
          name: preview-html
          path: tools/preview.html
          if-no-files-found: error
